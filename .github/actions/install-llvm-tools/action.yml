name: Install LLVM tools
description: Installs LLVM packages from apt.llvm.org (Ubuntu 26.04 only ships LLVM up to 22).

inputs:
  version:
    description: LLVM major version
    default: "23"
  packages:
    description: Space-separated package base names, e.g. "clang-format clang-tidy"
    required: true

runs:
  using: composite
  steps:
    - name: Add apt.llvm.org repository
      shell: bash
      run: |
        sudo install -d -m 0755 /etc/apt/keyrings
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor -o /etc/apt/keyrings/apt.llvm.org.gpg
        codename=$(lsb_release -cs)
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${{ inputs.version }} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list

    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          $(for p in ${{ inputs.packages }}; do echo "$p-${{ inputs.version }}"; done)
