name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-format

      - name: Install Lua
        run: sudo apt-get install -y --no-install-recommends lua5.4

      - name: Check formatting
        run: lua5.4 scripts/format.lua

  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # clang-tidy is only needed for the debug leg, which also runs it.
      - name: Install LLVM tools
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: ${{ matrix.preset == 'debug' && 'clang clang-tidy' || 'clang' }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev \
            ${{ matrix.preset == 'debug' && 'lua5.4' || '' }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-23

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Set up virtual CAN interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Run clang-tidy
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'debug' }}
        run: lua5.4 scripts/tidy.lua --preset debug
